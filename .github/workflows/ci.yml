name: CI
on: [push, pull_request]

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Get ArduinoJson and PNGdec
        run: |
          git clone --depth 1 --branch v7.4.3 https://github.com/bblanchon/ArduinoJson.git "$RUNNER_TEMP/ArduinoJson"
          git clone --depth 1 --branch 1.1.6 https://github.com/bitbank2/PNGdec.git "$RUNNER_TEMP/PNGdec"
      - name: Tests + 100% coverage gate (library and every board)
        run: make -C test ARDUINOJSON="$RUNNER_TEMP/ArduinoJson/src" PNGDEC="$RUNNER_TEMP/PNGdec/src"

  esp32-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "GFX Library for Arduino@1.6.9" "ArduinoJson@7.4.3" "PNGdec@1.1.6"
      - name: Compile every sketch
        run: |
          cp AF1/src/secrets.example.h AF1/src/secrets.h
          FQBN=esp32:esp32:esp32s3:CDCOnBoot=cdc,PSRAM=opi,FlashSize=16M
          for s in CheckpointA StandingsBoard DramaBoard; do
            arduino-cli compile --fqbn $FQBN --library AF1 $s
          done
          arduino-cli compile --fqbn $FQBN,PartitionScheme=custom --library AF1 MapBoard
